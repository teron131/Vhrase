      <stop offset="0.58" stop-color="#151119"/>
      <stop offset="1" stop-color="#0e0c11"/>
    </radialGradient>
    <radialGradient id="spill" gradientUnits="userSpaceOnUse" cx="25" cy="6.8" r="7">
      <stop offset="0" stop-color="#FF6242" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF6242" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bodyClip"><path clip-rule="evenodd" d="M3.2 29.2 8.5 22.2 6.8 22.9C9.5 19.4 11.4 15.2 14.7 11.8 16.9 9.5 17.6 6.8 19.7 5.0 21.3 3.6 23.8 3.3 25.5 4.1 26.2 4.5 26.6 5.2 26.7 6.1 29.0 6.8 30.0 9.3 29.0 11.5 28.6 12.3 27.9 12.9 27.3 13.2 27.9 11.1 27.3 9.7 25.8 9.1 24.2 10.0 24.2 11.8 24.2 13.4 24.2 17.7 21.9 21.3 18.0 23.2L12.8 26.0 13.7 23.9 3.2 29.2ZM19.6 12.8C18.6 16.8 14.4 19.6 9.9 22.3 14.1 18.5 17.1 16.0 19.6 12.8Z"/></clipPath>
    <clipPath id="wingClip"><path d="M21.2 10.6 19.6 12.8C18.6 16.8 14.4 19.6 9.9 22.3L6.8 22.9 2.5 21.5 12.5 9.0 17.8 6.9Z"/></clipPath>
    <linearGradient id="bird" gradientUnits="userSpaceOnUse" x1="16" y1="3.5" x2="16" y2="29.2">
      <stop offset="0" stop-color="#e3d9ed"/>
      <stop offset="0.5" stop-color="#c5acd3"/>
      <stop offset="1" stop-color="#a77db8"/>
    </linearGradient>
    <radialGradient id="mask" gradientUnits="userSpaceOnUse" cx="23.6" cy="7.4" r="4.4">
      <stop offset="0" stop-color="#f6f2fa" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#f6f2fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f6f2fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flight" gradientUnits="userSpaceOnUse" x1="15" y1="16" x2="7.8" y2="23.3">
      <stop offset="0" stop-color="#7A5CFF"/>
      <stop offset="1" stop-color="#4F38C2"/>
    </linearGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="12.5" y1="24.5" x2="3.5" y2="29">
      <stop offset="0" stop-color="#a77db8"/>
      <stop offset="0.45" stop-color="#a77db8"/>
      <stop offset="1" stop-color="#7A5CFF"/>
    </linearGradient>
    <linearGradient id="bill" gradientUnits="userSpaceOnUse" x1="27" y1="6" x2="28.5" y2="13">
      <stop offset="0" stop-color="#f3eef7"/>
      <stop offset="1" stop-color="#ab97bf"/>
    </linearGradient>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="0" y1="5.25" x2="0" y2="8.5">
      <stop offset="0" stop-color="#26162F"/>
      <stop offset="1" stop-color="#0C0910"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.5"/></filter>
    <filter id="crisp" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.1"/></filter>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="0.3"/></filter>
    <filter id="neon" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="0.28"/></filter>
  </defs>
  <rect width="32" height="32" fill="url(#background)"/>
  <rect width="32" height="32" fill="url(#spill)"/>
