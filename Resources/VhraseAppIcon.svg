<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 32 32">
  <title>Vhrase cyberpunk parrot</title>
  <desc>The radiant lavender parrot in a dark wraparound visor with a laser scanline in the app's orange; its color zones follow a real parrot's, in Vhrase's palette: a pale face, lavender coverts over a violet wing band and deeper violet flight feathers, a violet-tipped tail, and a pale bill, on an aubergine background.</desc>
