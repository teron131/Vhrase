    </g>
    <path fill="url(#tail)" filter="url(#crisp)" d="M13.7 23.9 12.8 26.0 2.0 30.5 1.5 27.0 6.8 22.9 9.9 22.3Z"/>
    <path fill="url(#bill)" d="M26.7 6.1C29.0 6.8 30.0 9.3 29.0 11.5 28.6 12.3 27.9 12.9 27.3 13.2 27.9 11.1 27.3 9.7 25.8 9.1 25.9 8.0 26.2 6.9 26.7 6.1Z"/>
    <path fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="0.14" stroke-linecap="round" d="M27.0 6.25C29.0 6.9 29.85 9.2 29.05 11.3"/>
  </g>
  <path fill="#000" opacity="0.45" filter="url(#shadow)" transform="translate(0.15 0.45)" d="M18.6 6.25 28.75 5.25 27.95 7.7C26.9 8.05 26.0 8.3 25.1 8.38 23.6 8.5 22.3 7.7 21.3 7.42L18.15 7.1Z"/>
  <path fill="url(#glass)" d="M18.6 6.25 28.75 5.25 27.95 7.7C26.9 8.05 26.0 8.3 25.1 8.38 23.6 8.5 22.3 7.7 21.3 7.42L18.15 7.1Z"/>
  <path fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="0.14" stroke-linecap="round" stroke-linejoin="round" d="M18.6 6.25 28.75 5.25"/>
  <path fill="#fff" opacity="0.13" d="M25.75 5.47 26.65 5.4 25.75 8.2 25.0 8.32Z M27.05 5.38 27.4 5.35 26.6 7.98 26.3 8.05Z"/>
  <path fill="none" stroke="#FF6242" stroke-width="0.7" stroke-linecap="round" opacity="0.9" filter="url(#neon)" d="M21.7 6.74 27.85 6.29"/>
  <path fill="none" stroke="#FF6242" stroke-width="0.3" stroke-linecap="round" d="M21.7 6.74 27.85 6.29"/>
  <path fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="0.09" stroke-linecap="round" d="M21.7 6.74 27.85 6.29"/>
</svg>
